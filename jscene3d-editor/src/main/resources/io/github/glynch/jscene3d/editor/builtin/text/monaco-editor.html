<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JScene3D Source Editor</title>
    <style>
      html, body, #editor { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      #failure { display: none; box-sizing: border-box; padding: 24px; }
    </style>
    <script src="loader.js"></script>
  </head>
  <body>
    <div id="editor"></div>
    <div id="failure" role="alert"></div>
    <script>
      let editor;
      let monacoReady = false;
      let attachedBridge;
      let initializationError;

      function applyAppearance(appearance) {
        if (!monacoReady || !appearance) return;
        monaco.editor.defineTheme('jscene3d-active', {
          base: appearance.base,
          inherit: true,
          rules: appearance.rules,
          colors: appearance.colors
        });
        monaco.editor.setTheme('jscene3d-active');
        document.documentElement.style.background = appearance.colors['editor.background'];
        document.body.style.background = appearance.colors['editor.background'];
        document.getElementById('failure').style.color = appearance.error;
        if (editor) {
          editor.updateOptions({
            fontFamily: appearance.fontFamily,
            fontSize: appearance.fontSize
          });
        }
      }

      function reportFailure(error) {
        initializationError = String(error && error.message ? error.message : error);
        document.getElementById('editor').style.display = 'none';
        const failure = document.getElementById('failure');
        failure.textContent = 'Unable to load the source editor: ' + initializationError;
        failure.style.display = 'block';
        if (attachedBridge) attachedBridge.initializationFailed(initializationError);
      }

      function initializeEditor() {
        if (!monacoReady || !attachedBridge || editor || initializationError) return;
        try {
          const language = String(attachedBridge.language());
          const resource = monaco.Uri.parse(String(attachedBridge.resource()));
          const model = monaco.editor.createModel(String(attachedBridge.initialContent()), language, resource);
          const appearance = JSON.parse(String(attachedBridge.appearance()));
          applyAppearance(appearance);
          editor = monaco.editor.create(document.getElementById('editor'), {
            model,
            theme: 'jscene3d-active',
            automaticLayout: true,
            fontFamily: appearance.fontFamily,
            fontSize: appearance.fontSize,
            minimap: { enabled: true },
            scrollBeyondLastLine: false,
            tabSize: 4,
            insertSpaces: true,
            ariaLabel: String(attachedBridge.accessibleLabel())
          });
          model.onDidChangeContent(function (event) {
            attachedBridge.contentChanged(model.getValue(), event.changes);
          });
          editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, function () {
            attachedBridge.saveRequested();
          });
          applyDiagnostics();
          applySelection();
        } catch (error) {
          reportFailure(error);
        }
      }

      window.attachJavaBridge = function (bridge) {
        attachedBridge = bridge;
        if (initializationError) attachedBridge.initializationFailed(initializationError);
        initializeEditor();
      };
      window.applyJavaAppearance = function () {
        if (attachedBridge) applyAppearance(JSON.parse(String(attachedBridge.appearance())));
      };
      function applyDiagnostics() {
        if (!editor || !attachedBridge) return;
        const severity = {
          ERROR: monaco.MarkerSeverity.Error,
          WARNING: monaco.MarkerSeverity.Warning,
          INFORMATION: monaco.MarkerSeverity.Info,
          HINT: monaco.MarkerSeverity.Hint
        };
        const markers = JSON.parse(String(attachedBridge.diagnostics())).map(function (marker) {
          marker.severity = severity[marker.severity] || monaco.MarkerSeverity.Error;
          return marker;
        });
        monaco.editor.setModelMarkers(editor.getModel(), 'jscene3d', markers);
      }
      function applySelection() {
        if (!editor || !attachedBridge) return;
        const range = JSON.parse(String(attachedBridge.selection()));
        if (!range) return;
        editor.setSelection(range);
        editor.revealRangeInCenter(range);
        editor.focus();
      }
      window.applyJavaDiagnostics = applyDiagnostics;
      window.applyJavaSelection = applySelection;
      window.focusEditor = function () { if (editor) editor.focus(); };
      window.runEditorCommand = function (command) {
        if (editor) editor.trigger('jscene3d', command, null);
      };
      window.disposeEditor = function () {
        if (editor) {
          const model = editor.getModel();
          editor.dispose();
          if (model) model.dispose();
          editor = undefined;
        }
      };

      if (typeof require !== 'function') {
        reportFailure('The bundled Monaco loader was not available');
      } else {
        require.config({ paths: { vs: '.' } });
        require(['vs/editor/editor.main'], function () {
          monacoReady = true;
          initializeEditor();
        }, reportFailure);
      }
    </script>
  </body>
</html>
